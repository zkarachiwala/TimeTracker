name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for code changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Diff against parent commit
        id: diff
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "Manual dispatch — deploying everything."
          elif git diff --name-only HEAD~1 HEAD | grep -qE '\.(cs|razor|csproj|sln|css)$'; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
            echo "No app code changed — skipping deploy and Playwright tests."
          fi

  migrate:
    name: Apply EF Core Migrations
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.code == 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.MIGRATIONS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TimeTracker.sln --locked-mode

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # EF Core's design-time tooling defaults to the Development environment for design-time
      # operations regardless of what the app would actually run as. That flips
      # ConnectionStringBuilder.Build's IsDevelopment() check true, which then expects DbUser/
      # DbPassword config that only exists as local user secrets - not in CI. Forcing Production
      # here keeps design-time script generation on the same code path as the real app.
      - name: Generate idempotent migration scripts
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          mkdir -p ./migrations-artifact
          ~/.dotnet/tools/dotnet-ef migrations script --idempotent \
            --context TimeTrackerDataContext \
            --project TimeTracker.Web/TimeTracker.Web.csproj \
            --output ./migrations-artifact/TimeTrackerDataContext.sql
          ~/.dotnet/tools/dotnet-ef migrations script --idempotent \
            --context IdentityDataContext \
            --project TimeTracker.Web/TimeTracker.Web.csproj \
            --output ./migrations-artifact/IdentityDataContext.sql

      # Uploaded before execution so the artifact is provably what ran, not a
      # regeneration — see D031.
      - name: Upload migration scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-scripts-${{ github.sha }}
          path: ./migrations-artifact/*.sql
          retention-days: 90

      - name: Get runner public IP
        id: ip
        run: echo "addr=$(curl -sf https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Open SQL firewall for runner
        run: |
          az sql server firewall-rule create \
            --resource-group ${{ vars.SQL_RESOURCE_GROUP }} \
            --server ${{ vars.SQL_SERVER }} \
            --name github-actions-migrate \
            --start-ip-address ${{ steps.ip.outputs.addr }} \
            --end-ip-address ${{ steps.ip.outputs.addr }}

      - name: Get Azure AD token for SQL
        id: token
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://database.windows.net \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT

      # mssql-tools18's bundled sqlcmd is the legacy ODBC-based tool - it doesn't understand
      # --long-option syntax at all and has no access-token auth mode. The modern,
      # cross-platform go-sqlcmd (which supports ActiveDirectoryAccessToken) ships as a dotnet
      # global tool instead, same install pattern already used for dotnet-ef and sqlpackage.
      - name: Install sqlcmd
        run: dotnet tool install --global Microsoft.SqlServer.Sqlcmd

      # go-sqlcmd's ActiveDirectoryAccessToken auth mode takes the token via SQLCMDPASSWORD,
      # not a dedicated --access-token flag - there's no separate flag for it, the token
      # substitutes for the password. Unverified beyond static review; if this step fails,
      # check `~/.dotnet/tools/sqlcmd --help` in the job log for the actual supported syntax.
      - name: Apply migration scripts
        env:
          SQLCMDPASSWORD: ${{ steps.token.outputs.value }}
        run: |
          ~/.dotnet/tools/sqlcmd -S ${{ vars.SQL_SERVER }}.database.windows.net -d ${{ vars.SQL_DATABASE }} \
            --authentication-method ActiveDirectoryAccessToken \
            -i ./migrations-artifact/TimeTrackerDataContext.sql
          ~/.dotnet/tools/sqlcmd -S ${{ vars.SQL_SERVER }}.database.windows.net -d ${{ vars.SQL_DATABASE }} \
            --authentication-method ActiveDirectoryAccessToken \
            -i ./migrations-artifact/IdentityDataContext.sql

      - name: Close SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ vars.SQL_RESOURCE_GROUP }} \
            --server ${{ vars.SQL_SERVER }} \
            --name github-actions-migrate \
            --yes 2>/dev/null || true

  deploy:
    name: Publish & Deploy
    runs-on: ubuntu-latest
    needs: [check, migrate]
    if: ${{ needs.check.outputs.code == 'true' }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TimeTracker.sln --locked-mode

      - name: Publish
        run: >
          dotnet publish TimeTracker.Web/TimeTracker.Web.csproj
          --configuration Release
          --output ./publish

      - name: Set startup command
        run: |
          RG=$(az webapp list --query "[?name=='${{ vars.AZURE_WEBAPP_NAME }}'].resourceGroup" -o tsv)
          az webapp config set --name ${{ vars.AZURE_WEBAPP_NAME }} --resource-group "$RG" --startup-file "dotnet TimeTracker.Web.dll"

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

  smoke:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: [check, deploy]
    if: ${{ needs.check.outputs.code == 'true' }}

    steps:
      - name: Assert login page is up
        run: |
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://timetracker-zak.azurewebsites.net/login)
            echo "Attempt $i: login page returned HTTP $HTTP_CODE"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Waiting 15s before retry..."
            sleep 15
          done
          echo "Smoke test failed after 5 attempts — last status $HTTP_CODE"
          exit 1

  showcase:
    name: Deploy Showcase to GitHub Pages
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.code == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish Showcase
        run: >
          dotnet publish TimeTracker.Client/TimeTracker.Client.csproj
          --configuration Release
          -p:Showcase=true
          -p:DefineConstants=SHOWCASE
          --output ./showcase-output

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./showcase-output/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
