version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Ubuntu's dotnet-sdk-10.0 apt package - the only SDK source in remote Claude
      # Code sessions - is permanently pinned to the .1xx feature band by Canonical
      # policy (dotnet/core#9258) and will never carry 2xx/3xx/4xx+. A version-bump
      # PR past 10.0.2xx is therefore never mergeable here regardless of what CI
      # says (actions/setup-dotnet downloads the SDK directly, so CI can't catch
      # this). This exact trap has recurred three times (#328, #355, #409/#410) -
      # ignoring it here stops Dependabot proposing it at all instead of relying on
      # someone noticing and closing it each time. Patches within the 1xx band
      # (e.g. 10.0.110 -> 10.0.112) are unaffected and still come through normally.
      - dependency-name: "dotnet-sdk"
        versions: [">= 10.0.200"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Bundle every routine GitHub Actions bump into one weekly PR instead of one
      # PR per action. Major version bumps for an action are excluded (semver-major
      # isn't in update-types below) so they still surface individually for review.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # EF Core packages must be upgraded together because they share a tight version
      # coupling through transitive dependencies. Upgrading only one package (e.g.
      # Microsoft.EntityFrameworkCore.Design) causes NU1605 "package downgrade" errors:
      # the upgraded package pulls in a newer Microsoft.EntityFrameworkCore.Relational,
      # which then requires a newer Microsoft.EntityFrameworkCore than what's pinned in
      # the other projects. Grouping ensures Dependabot raises one PR that bumps all of
      # them simultaneously, keeping the lock-step version requirement satisfied.
      entity-framework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.AspNetCore.Identity.EntityFrameworkCore"
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
      # The rest of the ASP.NET Core packages ship together in .NET's monthly patch
      # releases (e.g. 10.0.9 -> 10.0.10 across Web, Client and ComponentTests on the
      # same day). Grouping avoids 4-6 near-identical separate PRs each month.
      #
      # exclude-patterns is required, not just listing entity-framework-core first:
      # in practice Dependabot has proposed Microsoft.AspNetCore.Identity.EntityFrameworkCore
      # in *both* group PRs in the same run (see #356 vs #357), which breaks the
      # aspnetcore-runtime PR with a NU1605 downgrade error since it bumps that one
      # EF-Core-coupled package without its lock-step siblings. The explicit exclude
      # guarantees this package can only ever go to entity-framework-core.
      aspnetcore-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
        exclude-patterns:
          - "Microsoft.AspNetCore.Identity.EntityFrameworkCore"
      # MudBlazor and Microsoft.NET.Test.Sdk are each a direct PackageReference in three
      # separate projects. Without a group, Dependabot creates one PR per project file it
      # edits for an ungrouped dependency - three near-identical PRs bumping the same
      # version, which can also conflict with each other's project-file diffs depending
      # on timing. Grouping bundles each into a single PR across all three projects.
      mudblazor:
        patterns:
          - "MudBlazor"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
      # Catch-all for every other NuGet package's routine bumps: one PR a week instead
      # of one per package. Listed last so the more specific groups above still claim
      # their packages first. Major version bumps aren't included (semver-major isn't
      # in update-types), so a breaking change like the bUnit 1.x -> 2.x migration still
      # surfaces as its own individually-reviewed PR.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.0.9 pins Microsoft.OpenApi >= 2.0.0 and has not
      # been updated for the 3.x line yet (upstream release notes: 3.x support lands in
      # a future ASP.NET Core version). Stay on 2.x until that catches up.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
